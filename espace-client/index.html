<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khypnos — Mon espace</title>
    <meta name="description" content="Espace privé Khypnos — accédez à votre vidéothèque et vos ressources de formation.">
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" sizes="any">
    <link rel="stylesheet" href="/styles.css?v=private-ca2dcf52bea4152e">
    <link rel="stylesheet" href="/css/theme-elegance.css?v=private-ca2dcf52bea4152e">
    <link rel="stylesheet" href="/css/dashboard.css?v=private-ca2dcf52bea4152e">
    <link rel="stylesheet" href="/css/admin-banner-v2.css?v=private-ca2dcf52bea4152e">
</head>
<body>
<div class="container">
    <main class="dashboard-wrapper">
        <aside id="admin-access-v2" class="v2-admin-banner" hidden aria-label="Administration"></aside>
        <div id="app">
            <div class="loading-state">
                <div class="spinner" aria-hidden="true"></div>
                <span>Chargement de ton espace…</span>
            </div>
        </div>
    </main>
</div>
<script type="module">
    import { requireAuth, supabase } from '/espace-client/auth.js?v=private-ca2dcf52bea4152e';

    import { mountQcmAccess, escapeHTML, readQuizPortalStatus, planLabel } from '/espace-client/qcm-access.js?v=quiz-portal-20261031';

    const SUPABASE_URL = 'https://fbxiynomlxrjasbbcipp.supabase.co';

    const session = await requireAuth();
    if (!session) throw new Error('Non authentifié');

    const app = document.getElementById('app');
    let lastLoaded = 0;
    let loading = false;
    async function loadDashboard(force = false) {
      if (loading || (!force && (document.visibilityState !== 'visible' || !navigator.onLine || Date.now() - lastLoaded < 60000))) return;
      loading = true;
      lastLoaded = Date.now();
      try {
        const { data, error } = await supabase.auth.getSession();
        if (error) throw error;
        if (!data.session) { window.location.href = '/login.html'; return; }
        const res = await fetch(`${SUPABASE_URL}/functions/v1/get-dashboard`, {
          cache: 'no-store',
          ...(typeof AbortSignal.timeout === 'function' ? { signal: AbortSignal.timeout(10000) } : {}),
          headers: { Authorization: `Bearer ${data.session.access_token}` }
        });
        if (res.status === 401 || res.status === 403) {
          window.location.href = '/login.html?error=access_denied'; return;
        }
        if (!res.ok) throw new Error('Dashboard indisponible');
        const payload = await res.json();
        // Existing get-dashboard remains unchanged. These SELECTs use the
        // current user's RLS and only inform the display, never grant rights.
        try { Object.assign(payload, await readQuizPortalStatus(supabase, data.session.user.id)); }
        catch { payload.quizStatusUnavailable = true; }
        const { nom, planLabels = [], hasVideo, hasAnnales, protectedPages } = payload;

    const planTagsHTML = planLabels
        .map(label => `<span class="plan-tag">${escapeHTML(planLabel(label))}</span>`)
        .join('');

    const videoCardHTML = hasVideo ? `
        <section class="video-access-card" aria-labelledby="vac-title">
            <div class="vac-left">
                <div class="vac-icon" aria-hidden="true">🎬</div>
                <h2 id="vac-title">Vidéothèque</h2>
                <p>Retrouve toutes les vidéos de cours associées à ta formule.</p>
            </div>
            <a class="btn-videotheque" href="/espace-client/videotheque.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polygon points="5 3 19 12 5 21 5 3"/>
                </svg>
                Accéder
            </a>
        </section>
    ` : '';

    const annalesCardHTML = hasAnnales ? `
        <section class="annales-access-card" aria-labelledby="aac-title">
            <div class="aac-left">
                <div class="aac-icon" aria-hidden="true">📚</div>
                <h2 id="aac-title">Annales corrigées</h2>
                <p>Retrouve toutes les annales corrigées associées à ta formule.</p>
            </div>
            <a class="btn-annales" href="/espace-client/annales-corrigees.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                </svg>
                Accéder
            </a>
        </section>
    ` : '';

    const qcmCardHTML = '<div id="qcm-card-slot"></div>';

    const protectedPagesHTML = (protectedPages ?? []).length ? `
        <div class="notion-sections" style="margin-top:2rem">
            <h2 style="font-size:1.15rem;color:#1a1a2e;margin-bottom:1rem">Espaces privés</h2>
            ${protectedPages.map(p => `
                <a class="notion-link-card" href="${escapeHTML(p.href)}">
                    <div class="nlc-left">
                        <div class="nlc-icon" aria-hidden="true">🔒</div>
                        <div>
                            <div class="nlc-label">${escapeHTML(p.titre)}</div>
                            <div class="nlc-sub">Cours, corrections & documents →</div>
                        </div>
                    </div>
                    <svg class="nlc-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </a>
            `).join('')}
        </div>
    ` : '';

    // État vide si aucune ressource
    const emptyStateHTML = (!payload.quizStatusUnavailable && !planLabels.some(label => ['quiz_med', 'quiz_rfe'].includes(label)) && !hasVideo && !hasAnnales && !(protectedPages ?? []).length && !payload.quizEntitlements?.length && !payload.qcmSubscriptionActive)
        ? `<p class="notion-empty-state">Aucune ressource disponible pour le moment.</p>`
        : '';

    app.innerHTML = `
        <header class="dashboard-header">
            <h1>Bonjour ${escapeHTML(nom)} 👋</h1>
            <p>Voici tes accès et les ressources liées à tes formules.</p>
            <div class="plan-tags">${planTagsHTML}</div>
        </header>
        ${videoCardHTML}
        ${annalesCardHTML}
        ${qcmCardHTML}
        ${protectedPagesHTML}
        ${emptyStateHTML}
    `;
        const qcmCard = mountQcmAccess(document.getElementById('qcm-card-slot'), payload, {
          readSession: async () => {
            const { data, error } = await supabase.auth.getSession();
            if (error) throw error;
            return data.session;
          }
        });
        if (payload.quizStatusUnavailable) {
          const notice = document.createElement('p');
          notice.setAttribute('role','status');
          notice.textContent = 'Les dates de validité sont temporairement indisponibles. Tu peux toujours ouvrir l’application QCM.';
          qcmCard.append(notice);
        }
      } catch {
        app.querySelector('.loading-state')?.remove();
        let notice = document.getElementById('dashboard-retry');
        if (!notice) {
          notice = document.createElement('p');
          notice.id = 'dashboard-retry'; notice.setAttribute('role','alert');
          app.append(notice);
        }
        notice.textContent = 'Chargement indisponible. Vérifie ta connexion puis réessaie.';
        const retry = document.createElement('button');
        retry.type = 'button'; retry.textContent = 'Réessayer';
        retry.addEventListener('click', () => { void loadDashboard(true); });
        notice.append(' ', retry);
      } finally { loading = false; }
    }
    await loadDashboard(true);
    window.addEventListener('focus', () => { void loadDashboard(); });
    window.addEventListener('online', () => { void loadDashboard(); });
    document.addEventListener('visibilitychange', () => { void loadDashboard(); });
    setInterval(() => { void loadDashboard(); }, 60000);
</script>
<script type="module" src="/js/admin-banner-v2.js?v=private-ca2dcf52bea4152e"></script>
<script src="/js/header-manager.js?v=private-ca2dcf52bea4152e" defer></script>
<script src="/js/scroll-to-top.min.js?v=private-ca2dcf52bea4152e"></script>
<script src="/js/navbar.js?v=private-ca2dcf52bea4152e"></script>
<script src="/js/footer-manager.js?v=private-ca2dcf52bea4152e" defer></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        new FooterManager({
            anchor: '.container',
            position: 'beforeend'
        }).init();
    });
</script>
</body>
</html>
